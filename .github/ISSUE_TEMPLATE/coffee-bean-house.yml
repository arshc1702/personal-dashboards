name: Add a house bean
description: Add a bean to the Coffee panel's House Blend shelf. Use "Add a specialty bean" for Specialty Blend, or drag it across on the panel later.
title: "Coffee bean"
labels: ["coffee-bean", "blend:house"]
body:
  - type: input
    id: name
    attributes:
      label: Bean Name
      placeholder: "Ethiopia Chelbesa"
    validations:
      required: true
  - type: input
    id: roaster
    attributes:
      label: Roaster / Cafe
      placeholder: "Market Lane"
    validations:
      required: true
  - type: input
    id: origin
    attributes:
      label: Origin
      placeholder: "Ethiopia, Guji"
    validations:
      required: false
  - type: input
    id: roast_date
    attributes:
      label: Roast Date
      description: "From the bag — the panel shows days off roast and a freshness window from this."
      placeholder: "2026-09-15"
    validations:
      required: false
  - type: input
    id: dose
    attributes:
      label: Dose
      placeholder: "18g"
    validations:
      required: true
  - type: input
    id: yield
    attributes:
      label: Yield
      placeholder: "36g"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time
      placeholder: "28s"
    validations:
      required: true
  - type: input
    id: grind
    attributes:
      label: Grind
      description: "Setting on the Breville Dose Control Pro."
      placeholder: "2.5"
    validations:
      required: false
  - type: dropdown
    id: rating
    attributes:
      label: Rating
      description: "Optional — you can also rate it later from the panel."
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Tasting notes, grind setting, anything worth remembering"
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Image
      description: "Drag or paste a photo of the bag/beans here — GitHub uploads it automatically and inserts the link. Leave blank if you don't have one yet."
    validations:
      required: false
