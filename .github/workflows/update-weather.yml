name: Update weather data

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}      # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and transform weather
        run: |
          python3 scripts/fetch_weather.py

      - name: Commit if changed
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "Update weather data"
          git push
