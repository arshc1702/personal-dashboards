name: Log coffee entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  log:
    if: contains(github.event.issue.labels.*.name, 'coffee-log')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and log coffee entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/log_coffee.py

      - name: Commit if changed
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add data/coffee.json
          git diff --cached --quiet || git commit -m "Log coffee entry"
          git push
